name: Test Lift Bot Components
on:
  push:
    branches:
      - main
      - feature/lift-bot-integration
  pull_request:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install opencv-python mediapipe cjm-byte-track SQLAlchemy numpy uvicorn python-jose[cryptography] passlib[bcrypt] pydantic-settings
    - name: Run VideoStreamer test
      run: python video_streamer.py
    - name: Run Lift Bot Analyzer test
      run: python lift_bot_analyzer.py
    - name: Run Database Integration test
      run: python integrate_db.py
    - name: Run API tests
      env:
        API_KEY: your-api-key-change-in-production
        SECRET_KEY: your-secret-key-change-in-production
        TEST_MODE: "true"
      run: |
        nohup python3.11 lift_bot_api.py > api_server.log 2>&1 &
        sleep 5
        python3.11 test_api.py
        kill $(lsof -t -i:8000) || true

